[workspace]
members = [
  "abi",
  "acpi",
  "appkit",
  "karch",
  "boot",
  "core",
  "drivers",
  "font",
  "fs",
  "gfx",
  "image",
  "kernel",
  "kernel-services",
  "mm",
  "net",
  "pidfd",
  "ring",
  "sched",
  "signalfd",
  "service-core",
  "ktesting",
  "slibc",
  "userland",
  "terminal-core",
  "keymap-core",
  "chrome-core",
  "net-core",
  "shell-core",
  "video",
  "vt",
  "windowing",
  "slop-protocol",
  "slopos-ostd",
  "slopos-ostd-derive",
  "slopos-rt",
  "hermetic",
  "verification"
]
# Pinned TCB annexes: their content hash IS the pin (scripts/check_vendor_pin.sh),
# so workspace tooling must not ask for an edit. Both still build, via path dep
# and [patch.crates-io].
exclude = ["vendor/gimli", "vendor/unwinding"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
warnings = "deny"
non_camel_case_types = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"

[workspace.lints.cargo]
# Binary names are ABI, not style: each is a literal /bin/<name> in
# program_registry, the exec grant table and initramfs.
non_kebab_case_bins = "allow"

[workspace.lints.clippy]
type_complexity = "warn"
non_camel_case_types = "deny"

[workspace.dependencies]
bitflags = { version = "2.4", default-features = false }
libm = { version = "0.2", default-features = false }
limine = { version = "0.6.3", default-features = false }
slopos-arch = { path = "karch" }
slopos-abi = { path = "abi" }
slopos-acpi = { path = "acpi" }
slopos-appkit = { path = "appkit" }
slopos-boot = { path = "boot" }
slopos-core = { path = "core" }
slopos-drivers = { path = "drivers" }
slopos-font = { path = "font" }
slopos-fs = { path = "fs" }
slopos-gfx = { path = "gfx" }
slopos-image = { path = "image" }
slopos-ostd = { path = "slopos-ostd" }
slopos-ostd-derive = { path = "slopos-ostd-derive" }
slopos-rt = { path = "slopos-rt" }
  slopos-testing = { path = "ktesting" }
  slopos-kernel-services = { path = "kernel-services" }
slopos-mm = { path = "mm" }
slopos-net = { path = "net" }
slopos-pidfd = { path = "pidfd" }
slopos-ring = { path = "ring" }
slopos-sched = { path = "sched" }
slopos-signalfd = { path = "signalfd" }
slopos-slibc = { path = "slibc" }
slopos-terminal-core = { path = "terminal-core" }
slopos-keymap-core = { path = "keymap-core" }
slopos-chrome-core = { path = "chrome-core" }
slopos-net-core = { path = "net-core" }
slopos-shell-core = { path = "shell-core" }
slopos-protocol = { path = "slop-protocol" }
slopos-video = { path = "video" }
slopos-vt = { path = "vt" }
slopos-windowing = { path = "windowing" }
slopos-hermetic = { path = "hermetic" }
paste = { version = "1.0", default-features = false }
unwinding = { path = "vendor/unwinding", default-features = false, features = ["unwinder", "fde-gnu-eh-frame-hdr", "personality", "panic", "hide-trace"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Pinned TCB annexes (scripts/check_vendor_pin.sh). The patch resolves the
# registry `gimli` requested by vendor/unwinding to the vendored tree without
# editing the pinned unwinding manifest.
[patch.crates-io]
gimli = { path = "vendor/gimli" }
