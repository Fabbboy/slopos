[package]
name = "slopos-windowing"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SlopOS windowing: compositor connection, surfaces, and event loop"

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

test = false
doctest = false

[features]
alloc = ["slopos-gfx/alloc"]

[lints]
workspace = true

[dependencies]
slopos-abi = { workspace = true }
slopos-gfx = { workspace = true }
slopos-ostd = { workspace = true }
slopos-protocol = { workspace = true }
slopos-slibc = { workspace = true }
