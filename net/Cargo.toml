[package]
name = "slopos-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]
test = false
doctest = false

[features]
default = []
itests = []

[dependencies]
slopos-abi = { workspace = true }
slopos-alloc = { workspace = true }
slopos-arch = { workspace = true }
slopos-kernel-services = { workspace = true }
slopos-testing = { workspace = true }
slopos-sync = { workspace = true }
slopos-utils = { workspace = true }
slopos-service-core = { path = "../service-core" }
bitflags = { workspace = true }
# Direct dep needed for the `init!` / `pin_init!` macros, whose
# expansion references `$crate::__init_internal!` and so cannot be
# routed through `slopos-alloc`'s re-exports. Allowed by the
# alloc-dep gate (`pinned-init` is not the `alloc` crate).
pinned-init = { workspace = true, default-features = false, features = ["alloc"] }
