[package]
name = "slopos-font"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

doctest = false

[features]
default = []
kernel = ["dep:slopos-sync"]

[dependencies]
slopos-abi = { workspace = true }
slopos-alloc = { workspace = true }
slopos-gfx = { workspace = true }
slopos-sync = { workspace = true, optional = true }
libm = { workspace = true }
