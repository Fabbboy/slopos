[build]
target-dir = "builddir/target"

# NOTE: build-std and default target are intentionally NOT set here.
# Build scripts (scripts/build_kernel.sh, scripts/build_userland.sh) pass
# -Zbuild-std and --target explicitly. Keeping them out of config.toml
# allows `cargo test` to work on the host without conflicts.

[unstable]
json-target-spec = true

[target."targets/x86_64-slos.json"]
linker = "rust-lld"
rustflags = [
  "-C", "link-arg=-Tlink.ld",
  "-C", "panic=abort",
  "-C", "force-frame-pointers=yes",
  "-C", "code-model=kernel",
  "-C", "relocation-model=static",
  "-C", "target-cpu=x86-64",
  "-C", "target-feature=-mmx,-sse,-sse2,-sse3,-ssse3,-sse4.1,-sse4.2,-avx,-avx2,+soft-float",
  "-C", "no-redzone=yes",
  "-Z", "unstable-options",
  "-Z", "relro-level=off",
  "-Z", "emit-stack-sizes"
]

