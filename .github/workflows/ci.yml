name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  ci:
    name: Build, Format & Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/run_tests/go.mod
          cache-dependency-path: tools/run_tests/go.sum

      - name: Setup Rust + Go toolchains
        run: just setup

      - name: Check formatting
        run: just fmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            xorriso \
            e2fsprogs

      - name: Verify KVM availability
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::/dev/kvm not present on runner — KVM is required"
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          ls -l /dev/kvm
          qemu-system-x86_64 -accel help | grep -qw kvm || {
            echo "::error::qemu-system-x86_64 does not list kvm under -accel help"
            exit 1
          }

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> builddir/target"
          cache-directories: |
            third_party/limine
            third_party/ovmf
          cache-on-failure: true

      - name: Host-side unit tests (fast fail — same tests KernMiri interprets, minus UB detection)
        run: just test-host

      - name: Build kernel
        run: just build

      # Delegates to the justfile so the gate list has one home. This
      # step used to inline the list and had already drifted — it was
      # missing check_wait_predicate_purity.sh, which `check-framekernel`
      # has run for some time. `check-framekernel-gates` is the scripts
      # only; the fmt / KernMiri / Verus steps that `check-framekernel`
      # also runs are covered by the `Check formatting` step above and by
      # the separate `miri` and `verify` jobs below.
      - name: Framekernel gates (vendor pin + unsafe/async/alloc/Drop/stack + wait purity + task ownership + TCB ratio)
        run: just check-framekernel-gates

      # `--raw` rather than `just test`: the progress-bar renderer only surfaces
      # klog on failure, so a green run's log carries no `LOCKDEP[...]` lines for
      # the ratchets below to read. The verdict is unchanged — `ClassifyRun` sets
      # the exit code independently of which renderer ran.
      - name: Run tests
        run: |
          set -o pipefail
          just _build-run-tests
          builddir/run_tests --raw --no-color 2>&1 | tee ci-test.log

      # Both boot-based ratchets parse the capture above rather than booting
      # again: three QEMU boots for one question each is two boots wasted, and a
      # second boot could disagree with the one that was actually graded.
      # The tests kernel is the only variant whose allowlist carries
      # `run_userland_tests` — it powers the machine off to end the run. Gated
      # here rather than from `build_kernel.sh` because the walk disassembles
      # the whole ELF (~8 s), which does not belong on the interactive loop.
      - name: Authority reachability ratchet (tests kernel)
        run: scripts/check_authority_reachability.sh --variant tests builddir/kernel-tests.elf

      - name: Test-count ratchet
        run: scripts/check_test_count.sh --log ci-test.log

      - name: Lockdep headroom ratchet
        run: scripts/check_lockdep_headroom.sh --log ci-test.log

      # The invariant here is not a measured ceiling but a structural one: a CPU
      # that is online must be eligible for task placement. It shipped broken —
      # the scheduler boot step reset the runqueues of three APs that were
      # already running, and the machine spent every boot placing 100 % of forks
      # and wakeups on CPU 0 while the other three scavenged by work stealing.
      # Nothing else on the wire says so.
      - name: SMP placement-eligibility gate
        run: scripts/check_sched_spread.sh --log ci-test.log

      # The image the run above just wrote to, held to e2fsck and a clean
      # superblock. Free: the image is already on disk and e2fsprogs is already
      # installed. An image SlopOS wrote that e2fsck rejects is a bug in SlopOS.
      - name: On-disk consistency of the image the suite wrote
        run: just check-fs-image

      # Two more boots, filtered to the persistence tests, on one image that
      # is *not* rebuilt between them. Cannot reuse the capture above: the
      # question is whether a write on boot N is readable on boot N+1, which
      # one boot cannot answer. Kept in this job rather than a parallel one
      # because a second job would rebuild the kernel, userland and images
      # from scratch to save ~90 s of QEMU wall clock.
      - name: Two-boot persistence check
        run: just test-persist

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-log
          path: ci-test.log

  # The `ci` job gates the opt-level-0 dev kernel. Release codegen inlines
  # away roughly seven eighths of its functions, so the two images fail in
  # opposite directions: dev verifies ~31k frames against ~3.8k here, and
  # release is the only place an inlining decision that fuses small frames
  # into one oversized frame can show up.
  release-gates:
    name: Release kernel ELF gates
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup Rust toolchain
        run: scripts/ensure_toolchain.sh

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> builddir/target"
          prefix-key: "v0-release"
          cache-on-failure: true

      # The stack and soft-float gates run from build_kernel.sh itself, on
      # the ELF it just produced.
      - name: Build and gate the release kernel
        run: |
          scripts/check_stack_sizes.sh --self-test
          scripts/check_kernel_softfloat.sh --self-test
          scripts/check_registry_sections.sh --self-test
          scripts/check_authority_reachability.sh --self-test
          KERNEL_RELEASE=1 just build-kernel-only
          scripts/check_registry_sections.sh builddir/kernel-release.elf
          # The variant that ships. Its allowlist is shorter than dev's only
          # because optimisation inlines the handler closures; a *handler*
          # appearing here that is not in dev's list is a shipped image
          # reaching power by a path the dev build does not have.
          scripts/check_authority_reachability.sh --variant release builddir/kernel-release.elf

  miri:
    name: KernMiri (OSTD UB detection)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/run_tests/go.mod
          cache-dependency-path: tools/run_tests/go.sum

      - name: Setup Rust + Go toolchains
        run: just setup

      - name: Cache Miri sysroot
        uses: actions/cache@v6
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Cache Rust artifacts (Miri target dir)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> builddir/target"
          prefix-key: "v0-miri"
          cache-on-failure: true

      - name: Run KernMiri suite
        run: just check-miri

  verify:
    name: Verus (OSTD critical-path proofs)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip

      - name: Cache pinned Verus toolchain
        uses: actions/cache@v6
        with:
          path: third_party/verus
          key: verus-${{ runner.os }}-${{ hashFiles('verification/verus.toml') }}

      - name: Run Verus proofs
        # Any PR touching slopos-ostd/ must pass `just verify`. It
        # resolves + pins Verus via scripts/ensure_verus.sh, then checks
        # every proof under verification/proofs/.
        run: just verify
