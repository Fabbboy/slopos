name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  ci:
    name: Build, Format & Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/run_tests/go.mod
          cache-dependency-path: tools/run_tests/go.sum

      - name: Setup Rust + Go toolchains
        run: just setup

      - name: Check formatting
        run: just fmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            xorriso \
            e2fsprogs

      - name: Verify KVM availability
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::/dev/kvm not present on runner — KVM is required"
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          ls -l /dev/kvm
          qemu-system-x86_64 -accel help | grep -qw kvm || {
            echo "::error::qemu-system-x86_64 does not list kvm under -accel help"
            exit 1
          }

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> builddir/target"
          cache-directories: |
            third_party/limine
            third_party/ovmf
          cache-on-failure: true

      - name: Host-side unit tests (fast fail — same tests KernMiri interprets, minus UB detection)
        run: just test-host

      - name: Build kernel
        run: just build

      - name: Framekernel gates (vendor pin + unsafe/async/alloc/Drop/stack + TCB ratio)
        run: |
          scripts/check_vendor_pin.sh
          scripts/check_unsafe_outside_ostd.sh
          scripts/check_no_kernel_async.sh
          scripts/check_alloc_dep.sh
          scripts/check_drop_panic_free.sh
          scripts/check_stack_sizes.sh builddir/kernel.elf
          scripts/check_kernel_softfloat.sh builddir/kernel.elf
          scripts/tcb_ratio.sh --max 1.0

      - name: Run tests
        run: |
          set -o pipefail
          just test 2>&1 | tee ci-test.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-log
          path: ci-test.log

  miri:
    name: KernMiri (OSTD UB detection)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/run_tests/go.mod
          cache-dependency-path: tools/run_tests/go.sum

      - name: Setup Rust + Go toolchains
        run: just setup

      - name: Cache Miri sysroot
        uses: actions/cache@v6
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Cache Rust artifacts (Miri target dir)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> builddir/target"
          prefix-key: "v0-miri"
          cache-on-failure: true

      - name: Run KernMiri suite
        run: just check-miri

  verify:
    name: Verus (OSTD critical-path proofs)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip

      - name: Cache pinned Verus toolchain
        uses: actions/cache@v6
        with:
          path: third_party/verus
          key: verus-${{ runner.os }}-${{ hashFiles('verification/verus.toml') }}

      - name: Run Verus proofs
        # Any PR touching slopos-ostd/ must pass `just verify`. It
        # resolves + pins Verus via scripts/ensure_verus.sh, then checks
        # every proof under verification/proofs/. It is a green no-op
        # until the first proof lands.
        run: just verify
