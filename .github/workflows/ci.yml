name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  ci:
    name: Build, Format & Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/run_tests/go.mod
          cache-dependency-path: tools/run_tests/go.sum

      - name: Setup Rust + Go toolchains
        run: just setup

      - name: Check formatting
        run: just fmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            xorriso \
            e2fsprogs

      - name: Verify KVM availability
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::/dev/kvm not present on runner — KVM is required"
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          ls -l /dev/kvm
          qemu-system-x86_64 -accel help | grep -qw kvm || {
            echo "::error::qemu-system-x86_64 does not list kvm under -accel help"
            exit 1
          }

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> builddir/target"
          cache-directories: |
            third_party/limine
            third_party/ovmf
          cache-on-failure: true

      - name: Build kernel
        run: just build

      - name: Framekernel gates (unsafe surface + TCB ratio)
        run: |
          scripts/check_unsafe_outside_ostd.sh
          scripts/tcb_ratio.sh --max 1.5

      - name: Run tests
        run: |
          set -o pipefail
          just test 2>&1 | tee ci-test.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-log
          path: ci-test.log

  miri:
    name: KernMiri (OSTD UB detection)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/run_tests/go.mod
          cache-dependency-path: tools/run_tests/go.sum

      - name: Setup Rust + Go toolchains
        run: just setup

      - name: Cache Miri sysroot
        uses: actions/cache@v5
        with:
          path: ~/.cache/miri
          key: miri-sysroot-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Cache Rust artifacts (Miri target dir)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> builddir/target"
          prefix-key: "v0-miri"
          cache-on-failure: true

      - name: Run KernMiri suite
        run: just check-miri
