[package]
name = "slopos-ostd"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Exposes test-only constructors (e.g. `MetaSlot::new_unused`) needed
# by host-side integration tests that wire OSTD against scratch memory.
# Auto-enabled for the `cargo test` / `cargo miri test` paths via the
# `[dev-dependencies] slopos-ostd = { path = ".", features = [...] }`
# trick below; Miri-only pivots use `cfg(miri)` (auto-set by cargo-miri).
test-helpers = []

[dependencies]
bitflags = { workspace = true }
paste = { workspace = true }
slopos-abi = { workspace = true }
slopos-ostd-derive = { workspace = true }

# Gated to target_os = "none": host/Miri builds (`x86_64-unknown-linux-gnu`)
# already own the `eh_personality` lang item via `std`, so also linking
# `unwinding` (which supplies its own `eh_personality`/`_Unwind_*`) there
# collides (E0152).
[target.'cfg(target_os = "none")'.dependencies]
unwinding = { workspace = true }

[dev-dependencies]
# Enables the `test-helpers` feature on the lib whenever a `cargo
# test` run links against this crate, so integration tests can use
# `MetaSlot::new_unused` etc. without a separate `--features` flag.
slopos-ostd = { path = ".", features = ["test-helpers"] }
