[package]
name = "slopos-sched"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

test = false
doctest = false

[features]
default = []
# `slopos-ostd/test-helpers` because `sched_tests` drives OSTD-side test
# surfaces (the parked wait node). Without it, any build that turns on
# `test-hooks` alone fails to compile this crate's test module.
test-hooks = ["slopos-ostd/test-helpers"]

[dependencies]
slopos-abi = { workspace = true }
slopos-arch = { workspace = true }
slopos-ostd = { workspace = true }
slopos-kernel-services = { workspace = true }
slopos-mm = { workspace = true }
slopos-fs = { workspace = true }
slopos-hermetic = { workspace = true }
slopos-testing = { workspace = true }
paste.workspace = true
