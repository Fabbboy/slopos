[package]
name = "slopos-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

test = false
doctest = false

[features]
default = []
itests = ["slopos-mm/itests"]

[dependencies]
slopos-abi = { workspace = true }
slopos-alloc = { workspace = true }
slopos-arch = { workspace = true }
slopos-kernel-services = { workspace = true }
slopos-testing = { workspace = true }
slopos-sync = { workspace = true }
slopos-utils = { workspace = true }
slopos-mm = { workspace = true }
slopos-fs = { workspace = true }
slopos-net = { workspace = true }
slopos-font = { workspace = true, features = ["kernel"] }
paste.workspace = true
