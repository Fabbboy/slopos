[package]
name = "slopos-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["rlib"]

test = false
doctest = false

[features]
default = []
test-hooks = [
    "slopos-mm/test-hooks",
    "slopos-sched/test-hooks",
    "slopos-ring/test-hooks",
    "slopos-ostd/test-helpers",
]

[dependencies]
slopos-abi = { workspace = true }
slopos-arch = { workspace = true }
slopos-kernel-services = { workspace = true }
slopos-testing = { workspace = true }
slopos-mm = { workspace = true }
slopos-fs = { workspace = true }
slopos-net = { workspace = true }
slopos-ring = { workspace = true }
slopos-pidfd = { workspace = true }
slopos-signalfd = { workspace = true }
slopos-ostd = { workspace = true }
slopos-sched = { workspace = true }
slopos-font = { workspace = true, features = ["kernel"] }
slopos-hermetic = { workspace = true }
paste.workspace = true
